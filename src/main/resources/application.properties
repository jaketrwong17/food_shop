# ==========================================
# 1. Database Connection (Local MySQL)
# ==========================================
# Kết nối tới MySQL trên máy cá nhân, tạo sẵn database 'food_shop' nếu chưa có
spring.datasource.url=jdbc:mysql://localhost:3306/food_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# THAY DÒNG DƯỚI BẰNG MẬT KHẨU MYSQL TRÊN MÁY CỦA BẠN:
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. Hibernate & JPA
# ==========================================
# Đã đổi sang MySQLDialect mới theo cảnh báo log (MySQL8Dialect bị deprecated)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Tự động tạo/cập nhật bảng dựa trên Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 3. Server Config
# ==========================================
server.port=8080

# ==========================================
# 4. Spring MVC & Upload
# ==========================================
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp
# Giới hạn file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 5. Email Config
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jaketruong7@gmail.com
# HÃY TẠO MẬT KHẨU ỨNG DỤNG MỚI VÀ ĐIỀN VÀO ĐÂY (Tuyệt đối không dùng lại pass cũ đã lộ)
spring.mail.password=mat_khau_ung_dung_gmail_moi
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 6. Other Cấu hình khác
# ==========================================
spring.main.lazy-initialization=true
